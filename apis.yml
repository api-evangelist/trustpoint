name: TrustPoint
description: TrustPoint, Inc. is a space technology company building a fully commercial,
  next-generation global navigation satellite system (GNSS) — a C-band LEO microsatellite
  constellation delivering secure positioning, navigation, and timing (PNT) independent
  of GPS, with improved accuracy, faster time to first fix, and anti-jamming / anti-spoofing
  capabilities for automotive, aviation, critical infrastructure, and national security
  applications. Headquartered in Northern Virginia with an office in Mountain View,
  California, and backed by DCVC, TrustPoint does not currently publish a public API
  or developer portal.
